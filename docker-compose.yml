
# e.g. ~/cloudflared/docker-compose.yml  (its own project)
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    network_mode: host
    env_file:
      - variables.env
    # the command will read the TUNNEL_TOKEN from the environment file and don't need to add ${TUNNEL_TOKEN} explicitly. 
    command: tunnel --no-autoupdate run